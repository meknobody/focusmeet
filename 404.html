<body class="min-h-full flex flex-col justify-between antialiased relative bg-black text-white selection:bg-white selection:text-black">

  <!-- 404 MAIN HERO (MATCHING not-found-2.tsx SPEC) -->
  <main class="relative z-10 flex-1 flex items-center justify-center p-4 sm:p-6 w-full max-w-2xl mx-auto">
    <div class="theme-card rounded-3xl p-8 sm:p-14 text-center shadow-2xl w-full flex flex-col items-center gap-6">

  <!-- PROCEDURAL DOTTED GRID SCRIPT (MATCHING MAIN APP) -->
  <script>
    let dgCanvas, dgCtx, dgWidth, dgHeight, dgDpr = 1;
    let dgDots = [];
    const DG_DOT_SPACING = 24;
    const dgMouse = { x: -9999, y: -9999, targetX: -9999, targetY: -9999, active: false, trail: [] };

    function initGrid() {
      dgCanvas = document.getElementById('dotted-grid-canvas');
      if (!dgCanvas) return;
      dgCtx = dgCanvas.getContext('2d');
      resize();
      window.addEventListener('resize', resize);
      window.addEventListener('pointermove', (e) => {
        dgMouse.targetX = e.clientX;
        dgMouse.targetY = e.clientY;
        dgMouse.active = true;
      });
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) {
          dgMouse.targetX = e.touches[0].clientX;
          dgMouse.targetY = e.touches[0].clientY;
          dgMouse.active = true;
        }
      }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
          dgMouse.targetX = e.touches[0].clientX;
          dgMouse.targetY = e.touches[0].clientY;
          dgMouse.active = true;
        }
      }, { passive: true });
      window.addEventListener('touchend', () => {
        setTimeout(() => { dgMouse.active = false; }, 350);
      }, { passive: true });
      requestAnimationFrame(loop);
    }

    function resize() {
      dgDpr = Math.min(window.devicePixelRatio || 1, 2);
      dgWidth = window.innerWidth;
      dgHeight = window.innerHeight;
      dgCanvas.width = Math.floor(dgWidth * dgDpr);
      dgCanvas.height = Math.floor(dgHeight * dgDpr);
      dgCtx.setTransform(dgDpr, 0, 0, dgDpr, 0, 0);

      dgDots = [];
      const cols = Math.ceil(dgWidth / DG_DOT_SPACING) + 2;
      const rows = Math.ceil(dgHeight / DG_DOT_SPACING) + 2;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          dgDots.push({ ox: c * DG_DOT_SPACING, oy: r * DG_DOT_SPACING, x: c * DG_DOT_SPACING, y: r * DG_DOT_SPACING });
        }
      }
    }

    function loop() {
      dgMouse.x += (dgMouse.targetX - dgMouse.x) * 0.15;
      dgMouse.y += (dgMouse.targetY - dgMouse.y) * 0.15;

      dgCtx.fillStyle = '#000000';
      dgCtx.fillRect(0, 0, dgWidth, dgHeight);

      const radius = 130;
      for (let i = 0; i < dgDots.length; i++) {
        const dot = dgDots[i];
        let dx = dot.ox - dgMouse.x;
        let dy = dot.oy - dgMouse.y;
        let dist = Math.sqrt(dx * dx + dy * dy);

        let drawX = dot.ox;
        let drawY = dot.oy;
        let alpha = 0.18;
        let size = 1.0;

        if (dgMouse.active && dist < radius) {
          const factor = (1 - dist / radius);
          const angle = Math.atan2(dy, dx);
          const push = factor * 22;
          drawX += Math.cos(angle) * push;
          drawY += Math.sin(angle) * push;
          alpha = 0.18 + factor * 0.75;
          size = 1.0 + factor * 1.6;
        }

        dgCtx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        dgCtx.beginPath();
        dgCtx.arc(drawX, drawY, size, 0, Math.PI * 2);
        dgCtx.fill();
      }

      requestAnimationFrame(loop);
    }

    window.addEventListener('DOMContentLoaded', initGrid);
  </script>
</body>
